    <title>Clipped Article</title>
  </head>
  <body>
    <article>
      <h1>Clipped Article</h1>
      <p>This is the article body, long enough that content extraction keeps it as the main content. </p>
      <p>It repeats so the extractor has a clear body of text to work with, rather than a couple of words. </p>
      <p>A third paragraph makes the extracted article unambiguous for the clipper under test. </p>
    </article>
  </body>
